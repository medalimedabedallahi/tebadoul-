# En-tetes de securite communs (inclus par default.conf et production.conf).
# Attention : un add_header dans un bloc location annule l'heritage des add_header du serveur ;
# ne pas ajouter d'add_header dans les locations sans re-inclure ce fichier.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# CSP en mode rapport uniquement (rien n'est bloque) : Livewire et Alpine injectent des scripts
# inline et evaluent des expressions ('unsafe-inline' / 'unsafe-eval'). A durcir (nonces, build CSP d'Alpine)
# puis a basculer en Content-Security-Policy une fois les violations observees.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
