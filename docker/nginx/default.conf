# Nginx de developpement (HTTP simple, PHP-FPM sur app:9000).
# La production utilise production.conf (image nginx-production, TLS termine en frontal).

log_format badal '$remote_addr - [$time_iso8601] "$request" $status $body_bytes_sent '
                 '"$http_referer" "$http_user_agent" xff="$http_x_forwarded_for" '
                 'rt=$request_time rid=$request_id app_rid=$sent_http_x_request_id';

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 10m;

    access_log /dev/stdout badal;
    error_log /dev/stderr warn;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Fichiers caches (.env, .git...) : jamais servis. Doit preceder les locations PHP.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    # Assets Vite : noms hashes, donc cache long sans risque.
    location /build/ {
        access_log off;
        expires 1y;
        try_files $uri =404;
    }

    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # Sonde de l'healthcheck Docker : reponse statique, ne sollicite ni PHP ni la base.
    location = /nginx-health {
        access_log off;
        allow 127.0.0.1;
        deny all;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Seul index.php est execute par PHP-FPM ; tout autre .php est refuse.
    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ {
        return 404;
    }
}
