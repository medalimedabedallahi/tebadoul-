name: badal

services:
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${APP_PORT:-8098}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - badal

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "artisan", "about", "--only=environment"]
      interval: 15s
      timeout: 20s
      retries: 5
      start_period: 60s
    networks:
      - badal

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    command: php artisan queue:work --queue=critical,matching,notifications,default --sleep=1 --tries=3 --timeout=90
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - badal

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    command: php artisan schedule:work
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - badal

  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-54329}:5432"
    environment:
      POSTGRES_DB: "${DB_DATABASE:-badal}"
      POSTGRES_USER: "${DB_USERNAME:-badal}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-badal_local_password}"
    volumes:
      - badal-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-badal} -d ${DB_DATABASE:-badal}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - badal

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-badal_local_password}"
    ports:
      - "127.0.0.1:${FORWARD_REDIS_PORT:-6389}:6379"
    volumes:
      - badal-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:-badal_local_password}' ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - badal

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${FORWARD_MAILPIT_PORT:-8026}:8025"
      - "127.0.0.1:${FORWARD_MAIL_PORT:-1026}:1025"
    networks:
      - badal

networks:
  badal:
    driver: bridge

volumes:
  badal-postgres:
  badal-redis:
