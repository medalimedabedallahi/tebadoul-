; Reglages PHP communs au developpement et a la production (charge apres les .ini de l'image).

expose_php = Off
memory_limit = 256M
post_max_size = 16M
upload_max_filesize = 10M
max_execution_time = 60
date.timezone = UTC

; Les erreurs ne sont jamais affichees au client (Laravel rend ses propres pages d'erreur).
; error_log est volontairement non defini : PHP ecrit alors sur stderr (CLI) ou dans le flux
; capture par PHP-FPM (catch_workers_output = yes dans l'image officielle), donc dans `docker logs`.
; Ecrire sur /dev/stderr echouerait pour un utilisateur non root (tube appartenant a root).
error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off
html_errors = Off
log_errors = On

; Nginx n'envoie que /index.php a PHP-FPM ; interdit aussi la resolution de chemin approximative.
cgi.fix_pathinfo = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Developpement : le code est monte en volume, on revalide a chaque requete.
; La production surcharge ces valeurs dans php.production.ini.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
