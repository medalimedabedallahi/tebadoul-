# Nginx de production (image nginx-production, utilisateur non privilegie, port 8080).
# Le TLS est termine par un frontal (load balancer / reverse proxy) qui doit :
#   - rediriger tout le HTTP vers HTTPS ;
#   - ECRASER (et non completer) les en-tetes X-Forwarded-* recus du client ;
#   - etre joint uniquement par ce Nginx (aucun autre port publie).
# HSTS n'est emis que si le frontal indique X-Forwarded-Proto: https.

map $http_x_forwarded_proto $badal_hsts {
    default "";
    https   "max-age=31536000; includeSubDomains";
}

# Realip : IP/CIDR source vue par CE Nginx pour la connexion venant du frontal TLS (reverse proxy / load balancer
# qui termine le TLS ; voir compose.prod.yaml, service nginx, publie sur 127.0.0.1:${APP_PORT} par defaut).
# HYPOTHESE DE TOPOLOGIE (A VERIFIER avant la mise en production reelle, ex. via les journaux d'acces ou
# `docker network inspect badal-prod_badal`) : le frontal tourne sur le meme hote et joint ce service via le
# port publie ; la connexion traverse alors le NAT du reseau Docker et apparait ici avec l'IP de la passerelle
# du sous-reseau interne (BADAL_NETWORK_SUBNET, .1 par defaut -> 172.29.20.1). Si le frontal est ailleurs (hote
# distinct, macvlan, passerelle differente...), ajuster la valeur ci-dessous ET reconstruire l'image
# nginx-production (fichier copie tel quel au build, voir docker/php/Dockerfile, cible nginx-production).
set_real_ip_from 172.29.20.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

log_format badal '$remote_addr - [$time_iso8601] "$request" $status $body_bytes_sent '
                 '"$http_referer" "$http_user_agent" xff="$http_x_forwarded_for" '
                 'rt=$request_time rid=$request_id app_rid=$sent_http_x_request_id';

server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 10m;

    access_log /dev/stdout badal;
    error_log /dev/stderr warn;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Strict-Transport-Security $badal_hsts always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    # Assets Vite : noms hashes, donc cache long sans risque (pas d'add_header ici : voir security-headers.conf).
    location /build/ {
        access_log off;
        expires 1y;
        try_files $uri =404;
    }

    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location = /nginx-health {
        access_log off;
        allow 127.0.0.1;
        deny all;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Ecrase l'en-tete brut envoye par le client/frontal : PHP ne doit voir que l'IP reelle resolue par le
        # module realip ci-dessus (jamais une valeur fournie telle quelle, potentiellement falsifiee ou chainee).
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ {
        return 404;
    }
}
