name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Outils lances en conteneur / binaire, epingles par digest ou somme de controle.
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
  HADOLINT_IMAGE: ghcr.io/hadolint/hadolint:v2.14.0@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e
  NGINX_IMAGE: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  SPECTRAL_CLI_VERSION: 6.16.3

jobs:
  backend:
    name: Backend (PHP 8.5)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Identifiants ephemeres du service PostgreSQL de la CI (conteneur jetable, non expose) : ce ne sont pas des secrets.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: badal_testing
          POSTGRES_USER: badal
          POSTGRES_PASSWORD: ci-ephemeral-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U badal -d badal_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Lus par phpunit.pgsql.xml (qui ne force que DB_CONNECTION et DB_DATABASE) : les variables d'environnement
    # du processus priment sur .env.
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: badal
      DB_PASSWORD: ci-ephemeral-password

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_sqlite, pdo_pgsql
          coverage: none

      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # .env avant composer install : le hook package:discover demarre l'application, qui sans .env serait en
      # production avec MAIL_MAILER=log, configuration que AppServiceProvider refuse.
      - name: Configure application
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Audit PHP dependencies
        run: composer audit

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Static analysis
        run: composer analyse

      - name: Run tests (SQLite)
        run: php artisan test

      - name: Run tests (PostgreSQL)
        run: vendor/bin/phpunit --configuration=phpunit.pgsql.xml

  migrations:
    name: Migrations (aller-retour PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Gate "rollback applicatif" : chaque migration livree doit pouvoir etre annulee (methode down()) sans casser
    # le schema. Conteneur jetable, non expose : ces identifiants ne sont pas des secrets.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: badal_migrations
          POSTGRES_USER: badal
          POSTGRES_PASSWORD: ci-ephemeral-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U badal -d badal_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: badal_migrations
      DB_USERNAME: badal
      DB_PASSWORD: ci-ephemeral-password

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_pgsql
          coverage: none

      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # .env avant composer install : le hook package:discover demarre l'application, qui sans .env serait en
      # production avec MAIL_MAILER=log, configuration que AppServiceProvider refuse.
      - name: Configure application
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Migrations en attente (dry-run, verifie le SQL sans l'appliquer)
        run: php artisan migrate --pretend --no-interaction

      - name: Migrer
        run: php artisan migrate --force --no-interaction

      - name: Annuler (verifie que chaque migration a une methode down() qui fonctionne)
        run: php artisan migrate:rollback --force --no-interaction

      - name: Re-migrer (le schema retombe sur ses pieds apres l'aller-retour)
        run: php artisan migrate --force --no-interaction

  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Build frontend
        run: npm run build

  openapi:
    name: Contrat OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Lint docs/openapi.yaml (Spectral)
        run: >-
          npm exec --yes --package="@stoplight/spectral-cli@${SPECTRAL_CLI_VERSION}" --
          spectral lint docs/openapi.yaml --ruleset .github/spectral.yaml --fail-severity=error

  secrets-scan:
    name: Recherche de secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout (historique complet)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl --silent --show-error --fail --location --output gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check --strict
          tar --extract --gzip --file gitleaks.tgz gitleaks

      - name: Scan git history
        run: ./gitleaks git --redact --no-banner --verbose --exit-code 1 .

  docker-config:
    name: Configuration Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Hadolint (Dockerfile)
        run: |
          docker run --rm --interactive \
            --volume "$PWD/.github/hadolint.yaml:/cfg/hadolint.yaml:ro" \
            "$HADOLINT_IMAGE" hadolint --config /cfg/hadolint.yaml - < docker/php/Dockerfile

      - name: Valider compose.yaml (developpement)
        run: |
          cp .env.example .env
          docker compose -f compose.yaml config -q

      - name: Valider compose.prod.yaml (production)
        env:
          BADAL_ENV_FILE: .env.production.example
        run: docker compose --env-file .env.production.example -f compose.prod.yaml config -q

      - name: Valider la syntaxe Nginx (developpement et production)
        run: |
          for conf in default production; do
            docker run --rm --add-host app:127.0.0.1 \
              --volume "$PWD/docker/nginx:/cfg:ro" \
              "$NGINX_IMAGE" sh -c "mkdir -p /etc/nginx/snippets && cp /cfg/security-headers.conf /etc/nginx/snippets/ && cp /cfg/${conf}.conf /etc/nginx/conf.d/default.conf && nginx -t"
          done

      - name: Shellcheck (ops/ et entrypoints)
        run: |
          docker run --rm --volume "$PWD:/mnt:ro" --workdir /mnt \
            koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            -x ops/*.sh docker/php/entrypoint.sh docker/php/entrypoint.production.sh

      - name: Trivy (misconfiguration, HIGH/CRITICAL bloquant)
        run: |
          docker run --rm --volume "$PWD:/w:ro" "$TRIVY_IMAGE" \
            config --severity HIGH,CRITICAL --exit-code 1 /w/docker

  container:
    name: Images de production
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image PHP (production)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/php/Dockerfile
          target: production
          load: true
          push: false
          tags: badal-app:ci
          cache-from: type=gha,scope=badal-php
          cache-to: type=gha,scope=badal-php,mode=max

      - name: Build image Nginx (production)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/php/Dockerfile
          target: nginx-production
          load: true
          push: false
          tags: badal-nginx:ci
          # Reutilise les couches de l'etape production (deja construites ci-dessus) ; rien de plus a ecrire.
          cache-from: type=gha,scope=badal-php

      - name: Test de fumee des conteneurs
        run: bash ops/smoke-test.sh badal-app:ci badal-nginx:ci

      - name: Trivy (image PHP, HIGH/CRITICAL corrigeables bloquants)
        run: |
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln --exit-code 1 badal-app:ci

      - name: Trivy (image Nginx, HIGH/CRITICAL corrigeables bloquants)
        run: |
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln --exit-code 1 badal-nginx:ci
