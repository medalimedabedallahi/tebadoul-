version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - php
    groups:
      composer-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # Images de base epinglees par digest dans docker/php/Dockerfile (php, composer, node, nginx-unprivileged).
  - package-ecosystem: docker
    directory: /docker/php
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker

  # Images epinglees dans compose.yaml et compose.prod.yaml (nginx, postgres, redis, mailpit).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker

  # Actions epinglees par SHA de commit : Dependabot met a jour le SHA et le commentaire de version.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - "*"
