name: Release

# Publication des images de production (GHCR, taguees par SHA, avec provenance et SBOM) puis deploiement.
#
# Rien ne part automatiquement sur un simple push : ce workflow ne se declenche que sur un tag vX.Y.Z ou a la main.
# Le job `deploy` cible l'environnement GitHub `production` : configurer dans Settings > Environments > production
#   - Required reviewers (approbation manuelle obligatoire avant le deploiement) ;
#   - Deployment branches/tags limites a main / v*.
# Secrets attendus dans l'environnement production : DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS
# (sortie de `ssh-keyscan -t ed25519 <hote>` verifiee hors bande). Variable : DEPLOY_PATH (ex. /opt/badal).
# Le serveur doit deja disposer de .env.production, des Docker secrets (/etc/badal/secrets) et de l'acces a PostgreSQL :
# voir ops/README.md.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deployer apres publication (approbation manuelle requise dans l environnement production)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

jobs:
  publish:
    name: Publier les images (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      app_image: ${{ steps.meta.outputs.app_image }}
      nginx_image: ${{ steps.meta.outputs.nginx_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verifier que le commit appartient a main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::le commit ${GITHUB_SHA} n'est pas dans main : publication refusee"; exit 1; }

      - name: Calculer les noms d'image (minuscules obligatoires) et le tag
        id: meta
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          {
            echo "app_image=${REGISTRY}/${repository}-app"
            echo "nginx_image=${REGISTRY}/${repository}-nginx"
            echo "tag=sha-${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1) Construction locale + controles : rien n'est pousse tant que le test de fumee et Trivy ne passent pas.
      - name: Build image PHP (controle local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/php/Dockerfile
          target: production
          load: true
          push: false
          tags: badal-app:release
          cache-from: type=gha,scope=badal-php
          cache-to: type=gha,scope=badal-php,mode=max

      - name: Build image Nginx (controle local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/php/Dockerfile
          target: nginx-production
          load: true
          push: false
          tags: badal-nginx:release
          cache-from: type=gha,scope=badal-php

      - name: Test de fumee des conteneurs
        run: bash ops/smoke-test.sh badal-app:release badal-nginx:release

      - name: Trivy (images, HIGH/CRITICAL corrigeables bloquants)
        run: |
          for image in badal-app:release badal-nginx:release; do
            docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
              image --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln --exit-code 1 "$image"
          done

      # 2) Publication : couches issues du cache, tag immuable par SHA, provenance SLSA et SBOM attaches a l'image.
      - name: Publier l'image PHP
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/php/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.app_image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=badal-php

      - name: Publier l'image Nginx
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/php/Dockerfile
          target: nginx-production
          push: true
          tags: ${{ steps.meta.outputs.nginx_image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=badal-php

  deploy:
    name: Deployer en production
    needs: publish
    if: ${{ github.event_name == 'push' || inputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Approbation manuelle : les reviewers requis de l'environnement bloquent ce job tant qu'ils n'ont pas valide.
    environment: production

    concurrency:
      group: deploy-production
      cancel-in-progress: false

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparer SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copier compose.prod.yaml et ops/
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          tar --create --gzip --file - compose.prod.yaml ops \
            | ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
                "mkdir -p '${DEPLOY_PATH}' && tar --extract --gzip --file - --directory '${DEPLOY_PATH}' && chmod +x '${DEPLOY_PATH}'/ops/*.sh"

      - name: Connexion du serveur a GHCR (jeton ephemere, lecture seule)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" \
            | ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
                "docker login ${REGISTRY} --username '${GHCR_USER}' --password-stdin"

      - name: Deployer (sauvegarde pre-deploiement, migrations, bascule, controle de sante, retour auto)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          BADAL_IMAGE: ${{ needs.publish.outputs.app_image }}
          BADAL_NGINX_IMAGE: ${{ needs.publish.outputs.nginx_image }}
          DEPLOY_TAG: ${{ needs.publish.outputs.tag }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && BADAL_IMAGE='${BADAL_IMAGE}' BADAL_NGINX_IMAGE='${BADAL_NGINX_IMAGE}' ./ops/deploy.sh --yes '${DEPLOY_TAG}'"

      - name: Deconnexion de GHCR sur le serveur
        if: ${{ always() }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" "docker logout ${REGISTRY}" || true
